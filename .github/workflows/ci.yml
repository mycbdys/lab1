name: Secure API CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Bandit with SARIF support
        run: pip install "bandit[sarif]==1.9.4"
      - name: Bandit scan
        run: bandit -r app -f sarif -o bandit.sarif -ll
      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-sarif
          path: bandit.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit dependencies (CycloneDX)
        run: pip-audit -r requirements.txt --strict --format cyclonedx-json --output pip-audit.cdx.json
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-cyclonedx
          path: pip-audit.cdx.json
